apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "org.lyrion.squeezelite"
        compileSdk 35
        minSdkVersion 23
        targetSdkVersion 34
        buildToolsVersion = "35.0.0"
        versionCode  1100
        versionName "0.11.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndkVersion "27.2.12479018"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                targets "libsqueezelite.so"
            }
        }
    }
    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    buildTypes {
        debug {
            // DSD test build: installs beside the released app instead of over it
            applicationIdSuffix ".dsdtest"
            versionNameSuffix "-dsdtest-3"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // DSD test build: name the APK after its version, so copies handed out can be told apart
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'debug') {
            variant.outputs.all {
                outputFileName = "Squeezelite-${variant.versionName}.apk"
            }
        }
    }
    namespace 'org.lyrion.squeezelite'
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.media:media:1.8.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'io.github.muddz:styleabletoast:2.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
